#!/usr/bin/env ansible-playbook
---

- name: Validate StorPool YAML inventory
  hosts: localhost
  tasks:
    - name: Validate the YAML file
      yamlinspector:
        file_content: "{{ lookup('file', inventory_path) }}"
      vars:
        inventory_path: "{{ ansible_inventory_sources[0] }}"
      register: validation_results

    - name: Validation results
      debug:
        var: validation_results
  tags:
    - validate-yaml

- name: Gather localhost's facts
  hosts: localhost
  gather_subset:
    - min
  tasks: []
  tags:
    - always

- name: Ensure Python is installed
  hosts: storpool
  strategy: linear
  gather_facts: false
  become: true
  roles:
    - ensure_python
  tags:
    - always

- name: Build in-memory inventory groups
  hosts: storpool
  gather_facts: false
  tasks:
    - name: Generate group memberships
      ansible.builtin.import_tasks: tasks/generate_group_membership.yml
      when:
        - sp_create_groups_by_services
  tags:
    - always

- name: Configuring hosts
  hosts: storpool
  gather_facts: true
  gather_subset:
    - all
    - "!facter"
  roles:
    - storpool.bootstrap_host
    - storpool.install_sp_python
  tags:
    - bootstrap-hosts

- name: Installing StorPool components
  hosts: storpool
  gather_subset:
    - all
    - "!facter"
  pre_tasks:
    - name: Building in-memory inventory groups
      import_tasks: tasks/generate_group_membership.yml
      when:
        - sp_create_groups_by_services

  roles:
    - install_storpool_components
  tags:
    - install-storpool-components

- name: Configuring Networking
  hosts: storpool_block,storpool_server,storpool_mgmt,storpool_iscsi,storpool_bridge
  gather_subset:
    - all
    - "!facter"
  pre_tasks:
    - name: Building in-memory inventory groups
      include_tasks: tasks/generate_group_membership.yml
      when:
        - sp_create_groups_by_services
  roles:
    - configure_networking
  tags:
    - configure-networking

- name: Configure Drives
  hosts: storpool_server
  gather_facts: "{{'initialize-disks' in ansible_run_tags}}"
  gather_subset:
    - min
  roles:
    - initialize_disks
  tags:
    - initialize-disks

- name: Configure StorPool CGroups
  hosts: storpool_block,storpool_server,storpool_mgmt,storpool_iscsi,storpool_bridge
  gather_facts: false
  roles:
    - configure_cgroups
  tags:
    - configure-cgroups

- name: Configuring StorPool services
  hosts: storpool_block,storpool_server,storpool_mgmt,storpool_iscsi,storpool_bridge
  gather_subset:
    - all
    - "!facter"
  roles:
    - configure_services
  tags:
    - configure-services

- name: Performing system-wide testing
  hosts: storpool
  gather_subset:
    - all
    - "!facter"
  tasks:
    - name: Importing testing tasks
      import_tasks: tasks/perform_acceptance_tests.yml
  tags:
    - perform-tests
