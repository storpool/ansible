---
supported_installation_methods:
  - local
  - web

supported_release_targets:
  - release
  - pre-release
  - testing
  - sp-lab

gui_group_name: storpoolgui
gui_user_name: storpoolgui
gui_user_homedir: /usr/lib/storpool/gui

intel_ice_ddp_version: 1.3.43.0

grub_crashkernel_file:
  Debian: /etc/default/grub.d/kdump-tools.cfg
  RedHat: /etc/default/grub

crashkernel_value: "{{ (ansible_distribution_major_version | int < 9) | ternary('auto', (sp_crashkernel_memory | string) + 'M') }}"
