---
- name: Creating StorPool tools directory
  file:
    path: "{{ sp_tools_directory }}"
    state: directory
    mode: "0755"

- name: Creating StorPool system directories
  become: true
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/storpool
    - /etc/storpool.conf.d
    - /etc/storpool/mlc
    - /etc/cgconfig.d
    - /usr/lib/storpool
