- name: Update the YUM cache
  become: true
  ansible.builtin.yum:
    update_cache: True

- name: Set EL kernel package name
  ansible.builtin.set_fact:
    kernel_package_name: "kernel{{'-uek' if 'uek' in desired_kernel_version else ''}}"

- name: Extract EL release from kernel package name
  ansible.builtin.set_fact:
    el_release: "{{ desired_kernel_version | regex_search('el([0-9]+)_([0-9]+)', '\\1', '\\2') | join('.') }}"
  when:
    - ( ansible_distribution_major_version | int ) >= 8

- name: Copy EL kernel downgrade check script
  become: true
  copy:
    src: files/el_kernel_downgrade.sh
    dest: "{{ sp_tools_directory }}/el_kernel_downgrade.sh"
    mode: "0755"

- name: Check if newer kernels are present on the host
  ansible.builtin.command: "{{ sp_tools_directory }}/el_kernel_downgrade.sh {{ kernel_package_name }} {{ desired_kernel_version }}"
  register: downgrade_output
  failed_when: downgrade_output.rc not in [0, 1]
  changed_when: false

- name: Installing desired kernel version
  become: true
  ansible.builtin.yum:
    name: "{{ kernel_package_name }}-{{ desired_kernel_version }}"
    state: present
    allow_downgrade: "{{ downgrade_output.rc == 1 and (ansible_distribution_major_version | int) >= 8 }}"
    disablerepo: "{{ '*' if el_release is defined else omit }}"
    enablerepo: "{{ 'baseos' if el_release is defined else omit }}"
    releasever: "{{ el_release | default(omit) }}"
  notify:
    - Reboot host
