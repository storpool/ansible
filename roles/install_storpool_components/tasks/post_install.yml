---
- name: Restarting rsyslog
  become: true
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted
    enabled: true

- name: Reloading sysctl entries
  become: true
  ansible.builtin.command: /sbin/sysctl --system
  changed_when: false

- name: Enabling IOMMU in GRUB config
  become: true
  command: /usr/lib/storpool/enable_grub_iommu --no-change-exit-status 254
  register: enable_grub_iommu_result
  when:
    - not sp_vm | bool
    - sp_run_enable_grub_iommu | bool
  changed_when: enable_grub_iommu_result.rc == 0
  failed_when:
    - enable_grub_iommu_result.rc != 0
    - enable_grub_iommu_result.rc != 254
  notify:
    - Update GRUB configuration
    - Reboot host

- name: Running patchkdumptools on Debian-based OS
  become: true
  command: /usr/lib/storpool/patchkdumptools --no-change-exit-status 254
  register: patch_kdump_tools_result
  changed_when: patch_kdump_tools_result.rc == 0
  failed_when:
    - patch_kdump_tools_result.rc != 0
    - patch_kdump_tools_result.rc != 254
  notify:
    - Update GRUB configuration
    - Reboot host
  when:
    - ansible_os_family == "Debian"

- name: Increasing crashkernel size (Debian/Ubuntu)
  become: true
  ansible.builtin.lineinfile:
    path: /etc/default/grub.d/kdump-tools.cfg
    create: true
    regexp: crashkernel=.*
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT crashkernel={{ sp_crashkernel_memory }}M"'
    mode: "0644"
  notify:
    - Update GRUB configuration
    - Reboot host
  when:
    - ansible_os_family == "Debian"

- name: Copy default kernel script
  become: true
  copy:
    src: files/sp_set_kernel.py
    dest: "{{ sp_tools_directory }}/sp_set_kernel.py"
    mode: "0755"
  when:
    - sp_kernel_version is defined

- name: Set default kernel
  become: true
  ansible.builtin.command:
    cmd: >
      /opt/storpool/python3/bin/python3 -B -u
      "{{ sp_tools_directory }}/sp_set_kernel.py" "{{ sp_kernel_version }}"
  when:
    - sp_kernel_version is defined
  notify:
    - Update GRUB configuration
    - Reboot host

- name: Checking if the kernel cmdline contains all expected parameters
  become: true
  command: /usr/lib/storpool/kernel_cmdline_check --exit-code 2
  register: kernel_cmdline_check
  ignore_errors: true
  changed_when: kernel_cmdline_check.rc == 2
  failed_when: kernel_cmdline_check.rc == 1 or kernel_cmdline_check.rc >= 3
  notify:
    - Update GRUB configuration
    - Reboot host

- name: Ensure kdump service is enabled
  become: true
  ansible.builtin.systemd:
    name: kdump{{ "-tools" if ansible_os_family == "Debian" else "" }}.service
    enabled: true

- name: Start kdump service if kernel parameters are configured
  become: true
  ansible.builtin.systemd:
    name: kdump{{ "-tools" if ansible_os_family == "Debian" else "" }}.service
    state: started
  when:
    - kernel_cmdline_check.rc == 0

- name: Disabling random MAC address generation on Debian-based distributions
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/network/99-default.link.d/
    src: 10-disable-random-mac.conf
    mode: '0644'
  when:
    - ansible_distribution == 'Ubuntu'
    - ( ansible_distribution_major_version | int ) >= 22
  notify:
    - Reboot host

- name: Creating Intel ice module firmware directory
  become: true
  ansible.builtin.file:
    path: /lib/firmware/updates/intel/ice/ddp/
    state: directory
    mode: "0755"

- name: Downloading Intel DDP package
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/intel/ethernet-linux-ice/raw/refs/heads/main/ddp/ice-{{ intel_ice_ddp_version }}.pkg"
    dest: /lib/firmware/updates/intel/ice/ddp/
    mode: "0644"
  notify:
    - Rebuild initramfs
    - Reboot host

- name: Symlinking the Intel DDP package
  become: true
  ansible.builtin.file:
    src: "/lib/firmware/updates/intel/ice/ddp/ice-{{ intel_ice_ddp_version }}.pkg"
    dest: /lib/firmware/updates/intel/ice/ddp/ice.pkg
    state: link
    mode: "0644"
  notify:
    - Rebuild initramfs
    - Reboot host

- name: Execuite StorPool components post-installation hook
  become: true
  ansible.builtin.shell: "{{ sp_post_install_components_hook }}"  # noqa: command-instead-of-shell
  when:
    - sp_post_install_components_hook is defined

- name: Waiting for memory tests to complete
  become: true
  async_status:
    jid: "{{ memory_test_sleeper.ansible_job_id }}"
  register: job_result
  until: job_result.finished
  retries: 200
  delay: 30
  when:
    - not sp_vm | bool
    - memory_test_sleeper is defined
    - memory_test_sleeper.ansible_job_id is defined
