---
- name: Checking if the host boots via EFI
  become: true
  stat:
    path: /sys/firmware/efi
  register: sysfs_firmware_efi
  listen: Update GRUB configuration

- name: Rebuilding GRUB configuration on Debian-based OS
  become: true
  ansible.builtin.command: /usr/sbin/update-grub2
  listen: Update GRUB configuration
  when:
    - ansible_os_family == 'Debian'
    - not sysfs_firmware_efi.stat.exists

- name: Rebuilding GRUB configuration on Debian-based OS with EFI
  become: true
  ansible.builtin.command: grub-mkconfig -o /boot/efi/EFI/{{ ansible_distribution | lower }}/grub.cfg
  listen: Update GRUB configuration
  when:
    - ansible_os_family == 'Debian'
    - sysfs_firmware_efi.stat.exists
    - "'proxmox_hv' not in group_names"

- name: Rebuilding GRUB configuration on Proxmox hosts with EFI
  become: true
  ansible.builtin.command: grub-mkconfig -o /boot/efi/EFI/proxmox/grub.cfg
  listen: Update GRUB configuration
  when:
    - ansible_os_family == 'Debian'
    - sysfs_firmware_efi.stat.exists
    - "'proxmox_hv' in group_names"

- name: Rebuilding GRUB configuration on RHEL-based OS
  become: true
  shell: |
    /usr/sbin/grub2-mkconfig \
    {{ '--update-bls-cmdline' if (ansible_distribution_major_version | int >= 9)
                              else '' }} \
    -o $(readlink -f /etc/grub2{{ '-efi' if sysfs_firmware_efi.stat.exists else '' }}.cfg)
  changed_when: false
  listen: Update GRUB configuration
  when:
    - ansible_os_family == 'RedHat'

- name: Rebuidling initrd on RHEL-based OS
  become: true
  ansible.builtin.command: /usr/bin/dracut -f
  listen: Rebuild initramfs
  when:
    - ansible_os_family == 'RedHat'

- name: Rebuilding initrd on Debian-based OS
  become: true
  ansible.builtin.command: /usr/sbin/update-initramfs -u -k all
  listen: Rebuild initramfs
  when:
    - ansible_os_family == 'Debian'

- name: Rebooting host
  become: true
  ansible.builtin.reboot:
    reboot_timeout: 900
    post_reboot_delay: 60
  listen: Reboot host
  throttle: "{{ sp_reboot_sequentially | ternary(1, 63) }}"
  when:
    - sp_reboot_after_install

- name: Gather facts anew after reboot
  ansible.builtin.setup:
    gather_subset:
      - all
      - "!facter"
  listen: Reboot host
  when:
    - sp_reboot_after_install

- name: Find initrd* files in /var/lib/kdump on Proxmox host
  become: true
  ansible.builtin.find:
    paths: /var/lib/kdump
    patterns: '^initrd*'
    use_regex: true
  register: kdump_files
  listen: Rebuild kdump initrd
  when:
    - "'proxmox_hv' in group_names"

- name: Delete found initrd* files for Proxmox host
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ kdump_files.files }}"
  listen: Rebuild kdump initrd
  when:
    - "'proxmox_hv' in group_names"
    - kdump_files.matched > 0

- name: Rebuild kdump initrd
  become: true
  ansible.builtin.command: kdump-config reload
  listen: Rebuild kdump initrd
  when:
    - "'proxmox_hv' in group_names"
