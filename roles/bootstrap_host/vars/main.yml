---
common_packages:
  - bash-completion
  - bc
  - chrony
  - curl
  - dmidecode
  - dosfstools
  - fio
  - git
  - gdisk
  - hwloc
  - kexec-tools
  - logrotate
  - lshw
  - lsof
  - lsscsi
  - mc
  - man
  - mtr
  - net-tools
  - numactl
  - nvme-cli
  - patch
  - parted
  - pciutils
  - perl
  - psmisc
  - rsync
  - screen
  - socat
  - strace
  - sysstat
  - tar
  - tcpdump
  - tmux
  - vim
  - wget
  - xfsprogs

baremetal_only_packages:
  - ipmitool
  - lldpd
  - smartmontools

rc_local_commands:
  - "/usr/bin/cpupower set -b 0 || true; # set energy/performance policy to performance"
  - "/usr/bin/cpupower frequency-set -g performance; # set cpufreq/pstate governor to performance"
  - "/usr/bin/echo performance > /sys/module/pcie_aspm/parameters/policy 2> /dev/null || true; # disable sleep states for all PCIe links"
