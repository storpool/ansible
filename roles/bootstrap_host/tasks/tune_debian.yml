---
- name: Disabling ondemand service
  become: true
  ansible.builtin.systemd:
    name: ondemand.service
    state: stopped
    enabled: false
  when:
    - ansible_distribution == 'Ubuntu'
    - ( ansible_distribution_major_version | int ) <= 20

- name: Disabling apt periodic updates
  become: true
  ansible.builtin.lineinfile:
    path: /etc/apt/apt.conf.d/999storpool
    line: "{{ item }}"
    state: present
    create: true
    mode: '0644'
  loop:
    - APT::Periodic::Update-Package-Lists "0";
    - APT::Periodic::Unattended-Upgrade "0";

- name: Disabling multipathd service
  become: true
  ansible.builtin.systemd:
    name: "{{ service_name }}"
    state: stopped
    enabled: false
  loop_control:
    loop_var: service_name
  loop:
    - multipathd.service
    - multipathd.socket
  when:
    - ansible_distribution == 'Ubuntu'

- name: Disable kexec on normal reboot
  become: true
  ansible.builtin.lineinfile:
    path: /etc/default/kexec.d/99-storpool
    create: true
    mode: '0644'
    regexp: '^LOAD_KEXEC='
    line: 'LOAD_KEXEC=false'
    state: present
