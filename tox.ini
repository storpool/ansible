[tox]
skipsdist = true
env_list =
    lint
sources =
    library/yamlinspector.py
[testenv:lint]

deps =
    -r requirements-test.txt
    -r requirements.txt
commands =
    #ansible-lint
    black --check --line-length 99 {[tox]sources}
    isort {[tox]sources}
    flake8 --max-line-length=110 {[tox]sources}
    pylint --known-third-party ansible --max-line-length=110 {[tox]sources}
    mypy {[tox]sources}
    yamllint .

[testenv:black-reformat]
deps =
    -r requirements.txt
    -r requirements-test.txt
commands =
    black --line-length 99 {[tox]sources}
